apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp110-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp110-api
  template:
    metadata:
      labels:
        app: mp110-api
    spec:
      containers:
        - name: mp110-api
          image: mp110-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: sqlite:///mlflow.db
            - name: MLFLOW_MODEL_URI
              value: models:/pg-rent-g187@champion
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
